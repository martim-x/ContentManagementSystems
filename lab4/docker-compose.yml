name: cms-wordpress-lab4

services:
  db:
    image: mariadb:11
    container_name: lab4-db
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD: wppass
      MARIADB_ROOT_PASSWORD: rootpass
    volumes:
      - db_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - lab4

  wordpress:
    image: wordpress:latest
    container_name: lab4-web
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8094:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wppass
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG', true );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
    volumes:
      - wp_data:/var/www/html
    healthcheck:
      test: ["CMD", "php", "-r", "require_once('/var/www/html/wp-load.php'); echo 'ok';"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - lab4

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: lab4-phpmyadmin
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8096:80"
    environment:
      PMA_HOST: db
      PMA_USER: wp
      PMA_PASSWORD: wppass
    networks:
      - lab4

  wpcli:
    image: wordpress:cli
    container_name: lab4-wpcli
    user: "33:33"
    profiles:
      - tools
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wppass
    volumes:
      - wp_data:/var/www/html
    networks:
      - lab4

volumes:
  db_data:
  wp_data:

networks:
  lab4: