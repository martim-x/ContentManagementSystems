name: cms-drupal-lab9

services:
  db:
    image: postgres:16
    container_name: db9
    environment:
      POSTGRES_DB: drupal
      POSTGRES_USER: drupal
      POSTGRES_PASSWORD: drupal
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drupal"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - lab9

  web:
    build: .
    container_name: web9
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8106:80"
    volumes:
      - web_data:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "test -d /var/www/html"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lab9

  adminer:
    image: adminer:latest
    container_name: adminer9
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8107:8080"
    networks:
      - lab9

volumes:
  db_data:
  web_data:

networks:
  lab9: