# Drupal для ЛР. Запуск: docker compose up -d
# Сайт: http://localhost:8083
# При установке через веб-инсталлятор указать:
#   Тип БД: PostgreSQL, хост: db, база: drupal, пользователь: drupal, пароль: drupal
services:
  drupal:
    image: drupal:11
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8083:80"
    volumes:
      - drupal_data:/var/www/html
      - drupal_modules:/var/www/html/modules
      - drupal_profiles:/var/www/html/profiles
      - drupal_themes:/var/www/html/themes
      - drupal_sites:/var/www/html/sites

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: drupal
      POSTGRES_USER: drupal
      POSTGRES_PASSWORD: drupal
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  drupal_data:
  drupal_modules:
  drupal_profiles:
  drupal_themes:
  drupal_sites:
  db_data:
