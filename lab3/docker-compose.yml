name: cms-wordpress-lab3

services:
  db:
    image: mariadb:11
    container_name: lab3-db
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD: wppass
      MARIADB_ROOT_PASSWORD: rootpass
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 10

  wordpress:
    image: wordpress:latest
    container_name: lab3-web
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8090:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wppass
    volumes:
      - wp_data:/var/www/html

  wpcli:
    image: wordpress:cli
    container_name: lab3-wpcli
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wppass
    volumes:
      - wp_data:/var/www/html
    user: "33:33"
    profiles:
      - tools

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: lab3-phpmyadmin
    depends_on:
      - db
    ports:
      - "8092:80"
    environment:
      PMA_HOST: db
      PMA_USER: wp
      PMA_PASSWORD: wppass

volumes:
  db_data:
    name: cms-lab3-db-data
  wp_data:
    name: cms-lab3-wp-data